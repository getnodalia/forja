[package]
name = "forja-io"
description = "Forja file formats: DXF read/write mapping, SVG, PNG and PDF export"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
forja-geom = { workspace = true }
forja-color = { workspace = true }
forja-doc = { workspace = true }
nodalia-dxf = { workspace = true }
nodalia-dwg = { workspace = true }
nodalia-svg = { workspace = true }
nodalia-image-codecs = { workspace = true }
forja-render = { workspace = true }
forja-fonts = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
nodalia-pdf = { workspace = true, features = ["write"] }

[dev-dependencies]
miniz_oxide = "0.9"
tiff = "0.11"
image = { workspace = true }
tiny-skia = { workspace = true }
# Reads plotted PDFs back.
nodalia-pdf = { workspace = true, features = ["read"] }

# Inspect DWG output only where nodalia-dwg builds its native bridge. An unconditional
# dev-dependency also builds acadrust during --all-targets, breaking FreeBSD aarch64 (#2526).
[target.'cfg(not(any(target_arch = "wasm32", all(target_os = "freebsd", target_arch = "aarch64"))))'.dev-dependencies]
acadrust = "0.6.6"
