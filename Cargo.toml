[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
# default-members

[workspace.package]
version = "0.2.7"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/danielmigueltejedor/forja"

[workspace.dependencies]
# internal
forja-geom = { path = "crates/geom" }
# DXF tags: the shared reader and writer (moved from crates/dxf; nodalia-libs#791).
nodalia-dxf = { git = "https://github.com/getnodalia/foundation", rev = "a6eb9c3d814ac584f03725b2a0b1dabf70655b2d" }
# nodalia-dwg with two fixes Forja kept from its own copy (a damaged model space, viewport IDs):
# foundation branch vendor/nodalia-libs/forja-dwg-fixes, on top of upstream 7bb6c900.
nodalia-dwg = { git = "https://github.com/getnodalia/foundation", rev = "8043b3b057530a69652d14e871cb18ad40c4e2ff" }
nodalia-shx = { git = "https://github.com/getnodalia/foundation", rev = "e41e1c689c1e89fadeaa27b93e7fce31c24f6ecb" }
nodalia-image-codecs = { git = "https://github.com/getnodalia/foundation", rev = "ffc5a918892d57fb42f18c4dd5c7d8928403f948" }
nodalia-mime = { git = "https://github.com/getnodalia/foundation", rev = "053092695bc2468a4eee49662e9cb67cf06b74fa" }
forja-color = { path = "crates/color" }
forja-doc = { path = "crates/doc" }
forja-constraints = { path = "crates/constraints" }
forja-fonts = { path = "crates/fonts" }
forja-render = { path = "crates/render" }
forja-io = { path = "crates/io" }
forja-engine = { path = "crates/engine" }
forja-ui-egui = { path = "crates/ui-egui" }
forja-mcp = { path = "crates/mcp" }
nodalia-mcp = { git = "https://github.com/getnodalia/foundation", rev = "86af25ee14d6fd9189c3623a188532968e469eb5" }
nodalia-jsonrpc = { git = "https://github.com/getnodalia/foundation", rev = "86af25ee14d6fd9189c3623a188532968e469eb5" }
# SVG/SVGZ import and export geometry (nodalia-libs#778).
nodalia-svg = { git = "https://github.com/getnodalia/foundation", rev = "e6d43b3f7eccbf590256d9c5112733aa51edd658" }
# Which paths stored in a drawing (xrefs, data links) may be opened.
nodalia-docpath = { version = "0.1.0", git = "https://github.com/getnodalia/foundation", rev = "65a463571dd29bc67bee88b9c096b96888c2c3c3" }
# PDF writing (krilla) for plots, and reading them back in tests. The root patches below pin
# nodalia-pdf's patched backends to the same revision (Cargo ignores dependency-local patches).
nodalia-pdf = { version = "=0.1.0", git = "https://github.com/getnodalia/foundation", rev = "65a463571dd29bc67bee88b9c096b96888c2c3c3", default-features = false }
# TrueType embedding-permission classification for plotted fonts (nodalia-libs#778).
nodalia-font-catalog = { git = "https://github.com/getnodalia/foundation", rev = "afdbc265479d4beed07f9041a0e5ff1c0a2fbce1", default-features = false }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4.6.11"
clap_mangen = { version = "0.3.3", features = ["env"] }

# foundation
thiserror = "2"
same-file = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
# All date/time conversion goes through chrono (no hand-rolled calendar code beyond the 400-year range extension; AGENTS.md).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
rayon = "1"

# rendering / formats
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"] }
lyon_tessellation = "1.0.22"
skrifa = "0.48"
# Text shaping (OpenType GSUB/GPOS, HarfBuzz port on read-fonts; egui's epaint is still on 0.12,
# so the graph has both) and the Unicode Bidirectional Algorithm for right-to-left drawing text.
harfrust = "0.14"
unicode-bidi = "0.3.18"
# Line-break opportunities between Thai words for MTEXT word wrap (Thai writes no spaces between
# words): UAX #14 with ICU4X's compiled-in LSTM word model (not its dictionaries).
icu_segmenter = { version = "~2.3", default-features = false, features = ["compiled_data", "lstm"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tiff"] }
encoding_rs = "0.8.35"
# XML for the SVG reader (streaming parser, no entity expansion beyond the five predefined ones)
quick-xml = "0.42"

# ui
nodalia-ui = { version = "0.1.0", git = "https://github.com/getnodalia/foundation", rev = "65a463571dd29bc67bee88b9c096b96888c2c3c3", features = ["serde"] }
nodalia-window = { version = "0.1.0", git = "https://github.com/getnodalia/foundation", rev = "65a463571dd29bc67bee88b9c096b96888c2c3c3", features = ["egui"] }
egui = { version = "0.37", default-features = false, features = ["default_fonts", "monochrome_emoji_fonts"] }
# The Nodalia Design Language: tokens and the egui style built from them.
# Nodalia Design Language: tokens, icons and the engineering suite's shared parts and IBM Plex faces.
nodalia-theme = { git = "https://github.com/getnodalia/nodalia-design", rev = "74cb143582a7e428657073db5f9a88028a60ea3a", features = ["engineering"] }
# Resizable table columns (About ▸ Contributors / Models); no image loaders.
egui_extras = { version = "0.37", default-features = false }
egui_kittest = "0.37"
eframe = { version = "0.37", default-features = false }
egui-wgpu = "0.37"
# Monotonic time on native and web (performance.now on wasm).
web-time = "1.1"
# The in-app updater every Nodalia app shares (check, verified download, install, restart).
nodalia-update = { git = "https://github.com/getnodalia/nodalia-design", rev = "1713bdd6de43db49306a92ee192f2ee01d77cd95", features = ["egui"] }
rfd = "0.17"
arboard = { version = "3.6", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0

# PDF backends for nodalia-pdf: pinned to the same reviewed nodalia-libs revision as nodalia-pdf itself
# (Cargo ignores dependency-local patches).
[patch.crates-io]
krilla = { version = "=0.8.2", git = "https://github.com/getnodalia/foundation", rev = "65a463571dd29bc67bee88b9c096b96888c2c3c3" }
hayro-syntax = { git = "https://github.com/getnodalia/foundation", rev = "65a463571dd29bc67bee88b9c096b96888c2c3c3" }
hayro-jbig2 = { git = "https://github.com/getnodalia/foundation", rev = "65a463571dd29bc67bee88b9c096b96888c2c3c3" }

# Keep the complete egui family and native event bridge on reviewed fork commits.
ecolor = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_extras = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_kittest = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/getnodalia/foundation", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/getnodalia/foundation", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }

# nodalia-svg's path geometry, served from Nodalia's own copy of the same commit.
[patch."https://github.com/getnodalia/foundation"]
vectorcraft-geom = { git = "https://github.com/getnodalia/pluma", rev = "6b3a6b8788ebcb420d69449199cbdf323888d27e" }
vectorcraft-pathops = { git = "https://github.com/getnodalia/pluma", rev = "6b3a6b8788ebcb420d69449199cbdf323888d27e" }
